services:
  mysql:
    image: mysql:8.0
    container_name: utp_evalua_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: utp_evalua
      MYSQL_USER: utp_user
      MYSQL_PASSWORD: utp_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: utp_evalua_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://utp_user:utp_password@mysql:3306/utp_evalua
      CORS_ORIGINS: http://localhost:4200
      AUTO_CREATE_DB: 'true'
      AUTO_SEED_DATABASE: 'true'
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/swagger.json', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: utp_evalua_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src

volumes:
  mysql_data:

